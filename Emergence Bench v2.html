<title>Emergence Bench</title>

<style>
/* Layout: a three-pane lab bench — experiment rail, live stage, control drawer. Stacks to one column on phones. */
[hidden]{display:none!important}
:root{
  --ink:#121119; --stage:#0b0a10; --panel:#19181f; --panel-2:#24222d; --line:#302e3b;
  --fg:#eceaf3; --muted:#9b98ad; --soft:#cfcce0;
  --accent:#ffb454; --accent-ink:#1d1306; --cool:#7fd4e8;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr) 288px;grid-template-rows:auto auto minmax(0,1fr);gap:12px 14px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.mark{width:32px;height:32px;border-radius:10px;background:conic-gradient(from 210deg,#ffb454,#ff6f91,#9b8cff,#7fd4e8,#ffb454);position:relative}
.mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink)}
h1{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.now{display:flex;align-items:baseline;gap:10px;min-width:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.now b{color:var(--accent);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.rail{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:20px;padding-right:2px}
.rail-group{display:flex;flex-direction:column;gap:2px}
.rail h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 10px;font-weight:500}
.rail-item{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);cursor:pointer;font:inherit;transition:background .15s,border-color .15s}
.rail-item:hover{background:var(--panel)}
.rail-item[aria-current="true"]{background:var(--panel-2);border-color:var(--line)}
.sw{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--sw);box-shadow:0 0 0 3px color-mix(in srgb,var(--sw) 20%,transparent);flex:none}
.ri-name{display:block;font-weight:600;font-size:13.5px}
.ri-tag{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.stage-wrap{min-width:0;min-height:0}
.stage{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
#stage{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.chip{position:absolute;font-family:var(--f-mono);font-size:11.5px;line-height:1.4;padding:6px 10px;border-radius:8px;background:rgba(14,13,20,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);color:#dcdae8;pointer-events:none;max-width:calc(100% - 24px)}
.hint{left:12px;bottom:12px}
.stats{right:12px;top:12px;font-variant-numeric:tabular-nums;color:var(--accent)}
.big-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body);cursor:pointer;box-shadow:0 10px 40px rgba(255,180,84,.35)}
.big-play:hover{filter:brightness(1.06)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px;min-height:0;min-width:0}
.panel h2{font-family:var(--f-display);font-size:24px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.1}
.panel .tagline{margin:6px 0 0;color:var(--accent);font-size:13px;font-weight:500}
.panel .about{margin:10px 0 0;color:var(--muted);line-height:1.55;font-size:13px}
.controls{display:flex;flex-direction:column;gap:17px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ctl label,.ctl .lbl{font-size:12.5px;color:var(--soft);font-weight:500}
.ctl-choice .lbl{display:block;margin-bottom:8px}
output{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;margin:6px 0;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line) var(--p,50%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}

.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--fg);font:500 13px var(--f-body)}
.ctl-toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:22px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px);background:var(--accent-ink)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:600 12.5px var(--f-body);cursor:pointer;transition:filter .15s,background .15s}
.btn:hover{background:#2c2a36}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.file-name{display:block;margin-top:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
.tools{display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:background .15s}
.icon-btn:hover{background:var(--panel-2)}
.pos{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.search-btn{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 13px var(--f-body);cursor:pointer;min-width:250px;transition:border-color .15s,color .15s}
.search-btn:hover{border-color:var(--accent);color:var(--fg)}

.search-btn kbd{margin-left:auto}
.sections{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding-bottom:2px}
.sections::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 13px var(--f-body);cursor:pointer;transition:background .15s,color .15s}
.sec:hover{color:var(--fg);background:var(--panel)}
.sec[aria-current="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.sec-dot{width:8px;height:8px;border-radius:50%;background:var(--sw);display:inline-block;flex:none}
.sec-n{font-family:var(--f-mono);font-size:11px;opacity:.65;font-weight:500}
.launcher{position:fixed;inset:0;z-index:50;background:rgba(6,6,10,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 6vh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:16px}
.launch-panel{width:min(980px,100%);max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.launch-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.launch-head input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font:500 16px var(--f-body)}
.esc-btn{font:500 11px var(--f-mono);color:var(--soft);background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.launch-body{overflow:auto;padding:4px 16px 18px;overscroll-behavior:contain}
.launch-body h4{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:16px 0 8px}
.launch-body h4 span:last-child{opacity:.6}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.card{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--ink);color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.card .ri-tag{display:block}
.card.active{border-color:var(--accent);background:var(--panel-2)}
.card.is-current .ri-name::after{content:" · open";color:var(--accent);font-weight:500;font-size:11px}
.empty{color:var(--muted);padding:24px 4px;margin:0}
.txt{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--fg);font:500 13px var(--f-body)}
.ctl-text .lbl{display:block;margin-bottom:8px}
.foot kbd{font-size:10px}

@media (max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr) 256px}.rail .ri-tag{display:none}.search-btn{min-width:0}.search-btn .lbl-s{display:none}}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .search-btn kbd{display:none}.pos{min-width:44px}.brand p{display:none}.icon-btn{width:34px;height:34px}
  .rail{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .rail-group{display:contents}
  .rail h3{display:none}
  .rail-item{width:auto;flex:none;align-items:center;padding:8px 12px;white-space:nowrap;border-color:var(--line)}
  .sw{margin-top:0}
  .stage-wrap{height:62vh;min-height:340px}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const canvas=$('#stage'), ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=1,H=1,DPR=1,P={},current=null;
const pointer={x:0,y:0,down:false,inside:false};
const EXPS=[];
const SEC={gen:'Generative Art',ca:'Cellular Automata',phy:'Physics',math:'Mathematics',life:'Artificial Life',toy:'Interactive Toys'};const G1=SEC.gen,G2=SEC.ca,G3=SEC.phy;

const PALETTES={
  Ember:[[.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.1,.2]],
  Sunset:[[.5,.5,.5],[.5,.5,.5],[1,.7,.4],[0,.15,.2]],
  Lagoon:[[.5,.5,.5],[.5,.5,.5],[1,1,.5],[.8,.9,.3]],
  Coral:[[.8,.5,.4],[.2,.4,.2],[2,1,1],[0,.25,.25]],

const PAL_OPTS=Object.keys(PALETTES).map(k=>[k,k]);
function palRGB(name,t){const p=PALETTES[name]||PALETTES.Ember;const o=[0,0,0];for(let i=0;i<3;i++)o[i]=clamp(p[0][i]+p[1][i]*Math.cos(TAU*(p[2][i]*t+p[3][i])),0,1)*255|0;return o}
function palCSS(name,t,a=1){const c=palRGB(name,t);return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function buildLUT(name,n=2048){const lut=new Uint32Array(n);for(let i=0;i<n;i++){const c=palRGB(name,i/n);lut[i]=(0xff000000|(c[2]<<16)|(c[1]<<8)|c[0])>>>0}return lut}
function rgbU(hex){const n=parseInt(hex.slice(1),16);return (0xff000000|((n&255)<<16)|(((n>>8)&255)<<8)|((n>>16)&255))>>>0}
function fillBG(c){ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fillRect(0,0,W,H);ctx.restore()}

// Improved Perlin noise (3D)
const Noise=(()=>{const p=new Uint8Array(512),perm=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.random()*(i+1)|0;[perm[i],perm[j]]=[perm[j],perm[i]]}for(let i=0;i<512;i++)p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10),lerp=(a,b,t)=>a+t*(b-a);
  const grad=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)};
  return(x,y,z)=>{const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z);const X=fx&255,Y=fy&255,Z=fz&255;x-=fx;y-=fy;z-=fz;const u=fade(x),v=fade(y),w=fade(z);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lerp(lerp(lerp(grad(p[AA],x,y,z),grad(p[BA],x-1,y,z),u),lerp(grad(p[AB],x,y-1,z),grad(p[BB],x-1,y-1,z),u),v),
      lerp(lerp(grad(p[AA+1],x,y,z-1),grad(p[BA+1],x-1,y,z-1),u),lerp(grad(p[AB+1],x,y-1,z-1),grad(p[BB+1],x-1,y-1,z-1),u),v),w)}})();

/* ================= 1. Infinite Zoom ================= */
EXPS.push((()=>{
  const TARGETS={seahorse:[-0.743643887037158704752,0.131825904205311970493,1e-12],spiral:[-0.77568377,0.13646737,4e-8],dendrite:[-0.10109636384562,0.95628651080914,2e-12]};
  const HOME=[-0.6,0,3.4], INK=rgbU('#0b0a10');
  let cx,cy,span,tx,ty,maxDepth,off,octx,img,buf,fbuf,lut,res=2.4,lastMs=0,offset=0,drag=null,interactUntil=0,needFull=true,colorDirty=true,maxIt=0;
  const home=()=>{[cx,cy,span]=HOME};
  const aim=n=>{const t=TARGETS[n]||TARGETS.seahorse;tx=t[0];ty=t[1];maxDepth=t[2]};
  function compute(r){
    const w=Math.max(2,Math.round(W/r)),h=Math.max(2,Math.round(H/r));

/* ================= 4. Voronoi Art ================= */
EXPS.push((()=>{
  let pts=[],t=0,cents=null,hover=-1,downAt=null,fb=null,fctx,fimg,fbuf;
  const add=(x,y)=>{const a=Math.random()*TAU,s=rand(0.3,1);pts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:Math.random()})};

      ctx.beginPath();vor.renderCell(i,ctx);
      if(style==='glass'){ctx.fillStyle=palCSS(P.palette,colorOf(p),1);ctx.fill();const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,90);g.addColorStop(0,`rgba(255,255,255,${hv?.5:.22})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fill()}
      else if(style==='mosaic'){const c=palRGB(P.palette,colorOf(p));const m=hv?0.15:0.35;ctx.fillStyle=`rgb(${c[0]+(255-c[0])*m|0},${c[1]+(255-c[1])*m|0},${c[2]+(255-c[2])*m|0})`;ctx.fill()}

    if(P.sites){ctx.fillStyle=style==='mosaic'?'rgba(30,25,40,.7)':'rgba(255,255,255,.85)';ctx.beginPath();for(const p of pts){ctx.moveTo(p.x+2.2,p.y);ctx.arc(p.x,p.y,2.2,0,TAU)}ctx.fill()}

/* ================= adaptive complex-plane view helper ================= */
function PlaneView(home){const v={cx:home[0],cy:home[1],span:home[2],res:2.2,lastMs:0,until:0,dirty:true,drag:null};
  v.reset=()=>{v.cx=home[0];v.cy=home[1];v.span=home[2];v.dirty=true};
  v.toC=(x,y)=>[v.cx+(x-W/2)*v.span/W,v.cy-(y-H/2)*v.span/W];
  v.toS=(re,im)=>[W/2+(re-v.cx)*W/v.span,H/2-(im-v.cy)*W/v.span];
  v.moving=t=>t<v.until||!!v.drag;
  v.down=(x,y)=>{v.drag={x,y,cx:v.cx,cy:v.cy}};
  v.move=(x,y)=>{if(!v.drag||!pointer.down)return;v.cx=v.drag.cx-(x-v.drag.x)*v.span/W;v.cy=v.drag.cy+(y-v.drag.y)*v.span/W;v.dirty=true};
  v.up=()=>{v.drag=null;v.until=performance.now()/1000+0.15;v.dirty=true};
  v.wheel=(x,y,e)=>{const[mx,my]=v.toC(x,y);v.span=clamp(v.span*Math.exp(e.deltaY*0.0016),1e-10,20);v.cx=mx-(x-W/2)*v.span/W;v.cy=my+(y-H/2)*v.span/W;v.until=performance.now()/1000+0.25;v.dirty=true};
  v.adapt=()=>{if(v.lastMs>32)v.res=Math.min(7,v.res*1.12);else if(v.lastMs<15)v.res=Math.max(1.25,v.res/1.06)};
  return v}

      {type:'range',id:'m2',label:'Symmetry pole to pole',min:0,max:16,step:0.1,value:5},
      {type:'range',id:'n1',label:'n1 · overall pinch',min:0.15,max:6,step:0.01,value:0.3},
      {type:'range',id:'n2',label:'n2',min:0.1,max:10,step:0.01,value:0.3},
      {type:'range',id:'n3',label:'n3',min:0.1,max:10,step:0.01,value:0.3},
      {type:'range',id:'hue',label:'Hue',min:0,max:360,step:1,value:28},
      {type:'toggle',id:'morph',label:'Morph slowly',value:!reduced},
      {type:'toggle',id:'wire',label:'Wireframe',value:false}],
    init(){},...orbitHandlers(O),
    onParam(id,v){if(id==='preset'){const p=PRE[v];['m1','m2','n1','n2','n3'].forEach((k,i)=>setControl(k,p[i]))}},
    frame(dt){O.tick(dt);t+=dt;fillBG('#0b0b12');const[m1,m2,n1,n2,n3]=prm();const pts=[];let mxr=1e-9;const NU=64,NV=40;
      const cache=new Float32Array((NU+1)*(NV+1)*4);for(let j=0;j<=NV;j++)for(let i=0;i<=NU;i++){const th=-Math.PI+i/NU*TAU,ph=-Math.PI/2+j/NV*Math.PI,r1=sf(th,m1,n1,n2,n3),r2=sf(ph,m2,n1,n2,n3),x=r1*Math.cos(th)*r2*Math.cos(ph),y=r2*Math.sin(ph),z=r1*Math.sin(th)*r2*Math.cos(ph),k=(j*(NU+1)+i)*4;cache[k]=x;cache[k+1]=y;cache[k+2]=z;cache[k+3]=Math.hypot(x,y,z);if(isFinite(cache[k+3]))mxr=Math.max(mxr,cache[k+3])}
      mx=Math.min(mxr,50);const s=1.5/mx;drawMesh(O,NU,NV,(u,v)=>{const k=(Math.round(v*NV)*(NU+1)+Math.round(u*NU))*4,c=Math.min(cache[k+3]||0,mx)/mx;return[clamp(cache[k]*s,-3,3)||0,clamp(cache[k+1]*s,-3,3)||0,clamp(cache[k+2]*s,-3,3)||0,c]},val=>[(P.hue+val*90)%360,75,40+val*25],{wire:P.wire})},
    stats(){const p=prm();return `m ${p[0].toFixed(1)} / ${p[1].toFixed(1)} · n ${p[2].toFixed(2)}, ${p[3].toFixed(2)}, ${p[4].toFixed(2)}`}};
})());

/* ================= Shell ================= */
const GROUP_FIX={'maze':SEC.math,'audio-visualizer':SEC.toy};EXPS.forEach(e=>{if(GROUP_FIX[e.id])e.group=GROUP_FIX[e.id]});
const SECTIONS=[SEC.gen,SEC.ca,SEC.phy,SEC.math,SEC.life,SEC.toy];
const SEC_COL={[SEC.gen]:'#ffb454',[SEC.ca]:'#9fe870',[SEC.phy]:'#7fd4e8',[SEC.math]:'#c5a3ff',[SEC.life]:'#ff8f8f',[SEC.toy]:'#ffd27a'};
const ORDER=SECTIONS.flatMap(s=>EXPS.filter(e=>e.group===s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setters={};
let statsOverride=null,statsOverrideUntil=0;
function toastStats(msg){statsOverride=msg;statsOverrideUntil=performance.now()+4000}
function setControl(id,v){P[id]=v;setters[id]?.(v)}
function fmtNum(v,step){const d=step>=1?0:Math.min(3,String(step).split('.')[1]?.length||2);return(+v).toFixed(d)}
function renderControls(exp){const box=$('#controls');box.innerHTML='';for(const k in setters)delete setters[k];
  for(const c of exp.controls){const id=`${exp.id}-${c.id||c.type}`,row=document.createElement('div');row.className='ctl ctl-'+c.type;
    if(c.type==='range'){row.innerHTML=`<div class="ctl-top"><label for="${id}">${c.label}</label><output id="${id}-o" for="${id}"></output></div><input type="range" id="${id}" min="${c.min}" max="${c.max}" step="${c.step}">`;
      const inp=row.querySelector('input'),out=row.querySelector('output');const show=v=>{inp.value=v;out.textContent=fmtNum(v,c.step);inp.style.setProperty('--p',((v-c.min)/(c.max-c.min)*100)+'%')};show(P[c.id]);
      inp.addEventListener('input',()=>{P[c.id]=+inp.value;show(P[c.id]);exp.onParam?.(c.id,P[c.id])});setters[c.id]=show}
    else if(c.type==='choice'){if(c.options.length<=4){row.innerHTML=`<span class="lbl" id="${id}-l">${c.label}</span><div class="seg" role="group" aria-labelledby="${id}-l"></div>`;const seg=row.querySelector('.seg');
        const btns=c.options.map(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.title=l;b.id=`${id}-${v}`;b.onclick=()=>{P[c.id]=v;show(v);exp.onParam?.(c.id,v)};seg.appendChild(b);return[v,b]});
        const show=v=>btns.forEach(([bv,b])=>b.setAttribute('aria-pressed',String(bv===v)));show(P[c.id]);setters[c.id]=show}
      else{row.innerHTML=`<label class="lbl" for="${id}">${c.label}</label><select id="${id}">${c.options.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select>`;const sel=row.querySelector('select');sel.value=P[c.id];
        sel.addEventListener('change',()=>{P[c.id]=sel.value;exp.onParam?.(c.id,sel.value)});setters[c.id]=v=>sel.value=v}}
    else if(c.type==='toggle'){row.innerHTML=`<label for="${id}">${c.label}</label><span class="switch"><input type="checkbox" id="${id}"><span></span></span>`;const inp=row.querySelector('input');inp.checked=!!P[c.id];
      inp.addEventListener('change',()=>{P[c.id]=inp.checked;exp.onParam?.(c.id,inp.checked)});setters[c.id]=v=>inp.checked=!!v}
    else if(c.type==='text'){row.innerHTML=`<label class="lbl" for="${id}">${c.label}</label><input type="text" class="txt" id="${id}" maxlength="40" autocomplete="off" spellcheck="false" placeholder="${esc(c.placeholder||'')}">`;const inp=row.querySelector('input');inp.value=P[c.id];let tm;
      inp.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{P[c.id]=inp.value;exp.onParam?.(c.id,inp.value)},250)});setters[c.id]=v=>inp.value=v}
    else if(c.type==='buttons'){row.className='btns';c.items.forEach((it,k)=>{const b=document.createElement('button');b.type='button';b.id=`${id}-${k}`;b.className='btn'+(it.primary?' primary':'');b.textContent=it.label;b.onclick=()=>exp.action?.(it.action);row.appendChild(b)})}
    else if(c.type==='file'){row.innerHTML=`<label class="btn" for="${id}" style="display:block;text-align:center;cursor:pointer">${c.label}</label><input type="file" id="${id}" accept="${c.accept}" hidden><span class="file-name" id="${id}-n">Stays on your device</span>`;
      const inp=row.querySelector('input');inp.addEventListener('change',()=>{const f=inp.files&&inp.files[0];if(f){row.querySelector('.file-name').textContent=f.name;exp.onFile?.(f)}})}
    box.appendChild(row)}}

function renderSections(){const nav=$('#sections');nav.innerHTML='';for(const s of SECTIONS){const b=document.createElement('button');b.type='button';b.className='sec';b.dataset.sec=s;b.style.setProperty('--sw',SEC_COL[s]);
    b.innerHTML=`<span class="sec-dot" aria-hidden="true"></span>${s}<span class="sec-n">${ORDER.filter(e=>e.group===s).length}</span>`;b.onclick=()=>{if(current&&current.group===s)return;go(ORDER.find(e=>e.group===s).id)};nav.appendChild(b)}}
function renderRail(sec){const rail=$('#rail');if(rail.dataset.sec===sec)return;rail.dataset.sec=sec;rail.innerHTML='';const h=document.createElement('h3');h.textContent=sec;rail.appendChild(h);const grp=document.createElement('div');grp.className='rail-group';
  ORDER.filter(e=>e.group===sec).forEach(e=>{const b=document.createElement('button');b.type='button';b.className='rail-item';b.dataset.id=e.id;b.style.setProperty('--sw',e.swatch);
    b.innerHTML=`<span class="sw" aria-hidden="true"></span><span><span class="ri-name">${e.name}</span><span class="ri-tag">${e.tag}</span></span>`;b.onclick=()=>go(e.id);grp.appendChild(b)});rail.appendChild(grp)}
function go(id){if(location.hash!=='#'+id)location.hash=id;else select(id)}
function stepExp(d){const i=Math.max(0,ORDER.indexOf(current));go(ORDER[(i+d+ORDER.length)%ORDER.length].id)}

function resetCtx(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.setLineDash([]);ctx.shadowBlur=0;ctx.imageSmoothingEnabled=true;ctx.textAlign='left';ctx.textBaseline='alphabetic';canvas.style.cursor=''}
function select(id){const next=EXPS.find(e=>e.id===id)||ORDER[0];if(current===next)return;
  try{current?.destroy?.()}catch(e){}current=next;P={};next.controls.forEach(c=>{if('value'in c)P[c.id]=c.value});pointer.down=false;
  renderControls(next);$('#pTitle').textContent=next.name;$('#pTag').textContent=next.tag;$('#pAbout').textContent=next.about;$('#hint').textContent=next.hint;
  $('#pos').textContent=`${ORDER.indexOf(next)+1} / ${ORDER.length}`;renderRail(next.group);
  document.querySelectorAll('.sec').forEach(b=>{const on=b.dataset.sec===next.group;b.setAttribute('aria-current',String(on));if(on)b.scrollIntoView({inline:'nearest',block:'nearest'})});
  document.querySelectorAll('.rail-item').forEach(b=>{const on=b.dataset.id===next.id;b.setAttribute('aria-current',String(on));if(on)b.scrollIntoView({inline:'nearest',block:'nearest'})});
  $('#panel').scrollTop=0;resetCtx();fillBG('#0b0a10');try{next.init()}catch(err){console.error(err)}}

/* launcher (search across everything) */
let lItems=[],lActive=0;
function openL(){const L=$('#launcher');L.hidden=false;const q=$('#q');q.value='';renderL('');setTimeout(()=>q.focus(),0)}
function closeL(){$('#launcher').hidden=true;$('#searchBtn').focus()}
function setActive(i){if(!lItems.length)return;i=(i+lItems.length)%lItems.length;lItems.forEach((b,k)=>b.classList.toggle('active',k===i));lActive=i;lItems[i].scrollIntoView({block:'nearest'})}
function renderL(q){const words=q.toLowerCase().split(/\s+/).filter(Boolean),body=$('#lbody');body.innerHTML='';lItems=[];
  for(const s of SECTIONS){const list=ORDER.filter(e=>e.group===s&&words.every(w=>(e.name+' '+e.tag+' '+e.group+' '+e.about).toLowerCase().includes(w)));if(!list.length)continue;
    const sec=document.createElement('section');sec.innerHTML=`<h4><span class="sec-dot" style="--sw:${SEC_COL[s]}"></span>${s}<span>${list.length}</span></h4><div class="cards"></div>`;const cards=sec.querySelector('.cards');
    for(const e of list){const b=document.createElement('button');b.type='button';b.className='card'+(e===current?' is-current':'');b.style.setProperty('--sw',e.swatch);b.innerHTML=`<span class="sw" aria-hidden="true"></span><span><span class="ri-name">${e.name}</span><span class="ri-tag">${e.tag}</span></span>`;
      b.onclick=()=>{closeL();go(e.id)};b.onmousemove=()=>{const k=lItems.indexOf(b);if(k!==lActive)setActive(k)};cards.appendChild(b);lItems.push(b)}body.appendChild(sec)}
  if(!lItems.length){const p=document.createElement('p');p.className='empty';p.textContent=`Nothing matches "${q}". Try fractal, waves, evolution or sound.`;body.appendChild(p)}else setActive(0)}
$('#q').addEventListener('input',e=>renderL(e.target.value));
$('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();setActive(lActive+1)}else if(e.key==='ArrowUp'){e.preventDefault();setActive(lActive-1)}else if(e.key==='Enter'){e.preventDefault();lItems[lActive]?.click()}});
$('#launcher').addEventListener('click',e=>{if(e.target.id==='launcher')closeL()});
$('#closeL').onclick=closeL;$('#searchBtn').onclick=openL;$('#prevBtn').onclick=()=>stepExp(-1);$('#nextBtn').onclick=()=>stepExp(1);
$('#shuffleBtn').onclick=()=>{let e;do{e=ORDER[Math.random()*ORDER.length|0]}while(e===current);go(e.id)};
document.addEventListener('keydown',e=>{const L=!$('#launcher').hidden,ae=document.activeElement,typing=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||(ae.tagName==='INPUT'&&ae.type==='text'));
  if(L){if(e.key==='Escape'){e.preventDefault();closeL()}return}
  if((e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey)){e.preventDefault();openL();return}
  if(typing)return;if(e.key==='/'){e.preventDefault();openL();return}
  const free=!ae||ae===document.body||ae===canvas;if(e.key===']'||(free&&e.key==='ArrowRight')){e.preventDefault();stepExp(1)}else if(e.key==='['||(free&&e.key==='ArrowLeft')){e.preventDefault();stepExp(-1)}});

function resize(){const r=$('#stageBox').getBoundingClientRect();const nw=Math.max(1,Math.floor(r.width)),nh=Math.max(1,Math.floor(r.height)),nd=Math.min(2,window.devicePixelRatio||1);
  if(nw===W&&nh===H&&nd===DPR)return;W=nw;H=nh;DPR=nd;canvas.width=W*DPR;canvas.height=H*DPR;resetCtx();fillBG('#0b0a10');if(current){try{current.resize?current.resize():current.init()}catch(err){console.error(err)}}}

const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pos(e);Object.assign(pointer,{x,y,down:true,inside:true});current?.down?.(x,y,e)});
canvas.addEventListener('pointermove',e=>{const[x,y]=pos(e);pointer.x=x;pointer.y=y;pointer.inside=true;current?.move?.(x,y,e)});
const endP=e=>{if(!pointer.down)return;pointer.down=false;const[x,y]=pos(e);current?.up?.(x,y,e)};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('pointerleave',e=>{if(!pointer.down)pointer.inside=false;if(e.pointerType!=='mouse')pointer.inside=false});
canvas.addEventListener('wheel',e=>{if(!current?.wheel)return;e.preventDefault();const[x,y]=pos(e);current.wheel(x,y,e)},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

let last=performance.now(),fps=60,statT=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;fps+=((1/Math.max(dt,0.001))-fps)*0.05;
  if(current&&W>1&&$('#launcher').hidden){try{current.frame(dt,now/1000)}catch(err){console.error(err)}}
  statT+=dt;if(statT>0.3){statT=0;let s='';try{s=current?.stats?.()||''}catch(_){}$('#stats').textContent=(statsOverride&&now<statsOverrideUntil)?statsOverride:`${s} · ${Math.round(fps)} fps`}
  requestAnimationFrame(loop)}

renderSections();
new ResizeObserver(()=>resize()).observe($('#stageBox'));
resize();
const fromHash=()=>(location.hash||'').slice(1);
select(EXPS.some(e=>e.id===fromHash())?fromHash():'infinite-zoom');
window.addEventListener('hashchange',()=>select(fromHash()));
requestAnimationFrame(loop);
</script>

</body></html>
